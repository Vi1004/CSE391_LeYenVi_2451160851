<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Multimedia</title>
</head>

<body>
<h1>Giới thiệu sản phẩm</h1>

<!-- Ảnh sản phẩm -->
<section>
    <h2>Hình ảnh sản phẩm</h2>

    <figure>
        <img 
            src="https://placehold.co/400x300" 
            alt="Ảnh sản phẩm góc nhìn 1" 
            loading="lazy"
            style="max-width:100%; height:auto;"
        >
        <figcaption>Góc nhìn 1</figcaption>
    </figure>

    <figure>
        <img 
            src="https://placehold.co/400x300" 
            alt="Ảnh sản phẩm góc nhìn 2" 
            loading="lazy"
            style="max-width:100%; height:auto;"
        >
        <figcaption>Góc nhìn 2</figcaption>
    </figure>

    <figure>
        <img 
            src="https://placehold.co/400x300" 
            alt="Ảnh sản phẩm chi tiết" 
            loading="lazy"
            style="max-width:100%; height:auto;"
        >
        <figcaption>Chi tiết sản phẩm</figcaption>
    </figure>

</section>

<!-- Video YouTube -->
<section>
    <h2>Video giới thiệu (YouTube)</h2>

    <iframe 
        width="560" 
        height="315" 
        src="https://www.youtube.com/embed/dQw4w9WgXcQ" 
        title="Video giới thiệu sản phẩm"
        frameborder="0"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
        allowfullscreen>
    </iframe>

</section>

<!-- Video HTML -->
<section>
    <h2>Video sản phẩm</h2>

    <video controls poster="https://placehold.co/600x400">
        <source src="video.mp4" type="video/mp4">
        <source src="video.webm" type="video/webm">
        Trình duyệt không hỗ trợ video.
    </video>

</section>

<!-- Audio -->
<section>
    <h2>Nhạc nền</h2>

    <audio controls>
        <source src="audio.mp3" type="audio/mpeg">
        Trình duyệt không hỗ trợ audio.
    </audio>

</section>

<!-- SVG -->
<section>
    <h2>Logo (SVG)</h2>

    <svg width="100" height="100">
        <!-- hình tròn -->
        <circle cx="50" cy="50" r="40" fill="orange"></circle>
    </svg>

</section>

</body>
</html>
