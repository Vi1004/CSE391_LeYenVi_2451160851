<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Real-time Form Validator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="form-card">
        <h2>Đăng Ký Tài Khoản</h2>
        <form id="regForm">
            <div class="form-group">
                <label>Họ và tên</label>
                <input type="text" id="username" placeholder="Từ 2-50 ký tự">
                <span class="feedback"></span>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="text" id="email" placeholder="example@domain.com">
                <span class="feedback"></span>
            </div>
            <div class="form-group">
                <label>Mật khẩu</label>
                <input type="password" id="password">
                <div class="strength-bar"><div id="strengthProgress"></div></div>
                <span class="feedback"></span>
            </div>
            <div class="form-group">
                <label>Xác nhận mật khẩu</label>
                <input type="password" id="confirmPassword">
                <span class="feedback"></span>
            </div>
            <div class="form-group">
                <label>Số điện thoại</label>
                <input type="text" id="phone" placeholder="Nhập 10 chữ số">
                <span class="feedback"></span>
            </div>
            <button type="submit" id="submitBtn" disabled>Đăng ký</button>
        </form>
    </div>
    <script src="app.js"></script>
</body>
</html>
