<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>CSS Animations & Transitions Demo</title>
    <link rel="stylesheet" href="animations.css">
</head>
<body>

    <div style="padding: 40px; display: flex; flex-direction: column; align-items: center; gap: 40px;">
        
        <div class="spinner"></div>

        <div class="card anim-fade-in">
            <div class="card-img-container">
                <img src="https://picsum.photos/400/350?random=10" alt="Demo">
            </div>
            <div class="card-body">
                <h3>Thẻ Sản Phẩm Hoạt Họa</h3>
                <p>Nội dung này xuất hiện mượt mà cùng hiệu ứng Fade In khi vừa tải trang.</p>
                <button class="btn-buy">Mua ngay</button>
            </div>
        </div>

    </div>

</body>
</html>
